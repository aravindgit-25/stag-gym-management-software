<app-notification></app-notification>
<app-confirm></app-confirm>

<div class="app-wrapper" [class.invoice-layout]="isInvoicePage" *ngIf="authService.isLoggedIn(); else loginView">
  <div class="sidebar-overlay" *ngIf="sidebarOpen()" (click)="closeSidebar()"></div>

  <ng-container *ngIf="!isInvoicePage">
    <aside class="app-sidebar" [class.open]="sidebarOpen()">
      <div class="sidebar-logo">
        <div class="mark"></div>
        STAG <strong>GYM</strong>
      </div>
      <nav class="sidebar-nav">
        <a *ngIf="authService.isOwner()" class="nav-item" routerLink="/dashboard" routerLinkActive="active" (click)="closeSidebar()">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          </span> Dashboard
        </a>
        
        <div class="nav-group" [class.expanded]="membersMenuOpen()">
          <a class="nav-item has-submenu" (click)="toggleMembersMenu($event)">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            </span> Members
            <span class="chevron">
              <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </span>
          </a>
          <div class="sub-nav">
            <a class="sub-nav-item" routerLink="/members" [queryParams]="{filter: 'all'}" routerLinkActive="active" (click)="closeSidebar()">All Members</a>
            <a class="sub-nav-item" routerLink="/members" [queryParams]="{filter: 'active'}" routerLinkActive="active" (click)="closeSidebar()">Active Members</a>
            <a class="sub-nav-item" routerLink="/members" [queryParams]="{filter: 'inactive'}" routerLinkActive="active" (click)="closeSidebar()">Inactive Members</a>
          </div>
        </div>

        <div class="nav-group" [class.expanded]="staffMenuOpen()">
          <a class="nav-item has-submenu" (click)="toggleStaffMenu($event)">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
            </span> Staff
            <span class="chevron">
              <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </span>
          </a>
          <div class="sub-nav">
            <a class="sub-nav-item" routerLink="/staff" routerLinkActive="active" (click)="closeSidebar()">Staff Management</a>
            <a class="sub-nav-item" routerLink="/salary" routerLinkActive="active" (click)="closeSidebar()">Payroll</a>
          </div>
        </div>

        <a class="nav-item" routerLink="/attendance" routerLinkActive="active" (click)="closeSidebar()">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
          </span> Attendance
        </a>

        <a class="nav-item" routerLink="/diet-plans" routerLinkActive="active" (click)="closeSidebar()">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path></svg>
          </span> Diet Plans
        </a>

        <a *ngIf="authService.isOwner()" class="nav-item" routerLink="/payments" routerLinkActive="active" (click)="closeSidebar()">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          </span> Accounts
        </a>
      </nav>
      
      <div class="sidebar-footer">
         <a class="nav-item logout-btn" (click)="authService.logout()">
           <span class="nav-icon">
             <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
           </span> Logout
         </a>
      </div>
    </aside>

    <header class="app-header">
      <div class="header-left">
        <button class="menu-toggle" (click)="toggleSidebar($event)">
          <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        
        <!-- Branch Switcher -->
        <div class="branch-switcher" *ngIf="authService.isOwner()">
          <select [ngModel]="authService.selectedBranchId()" (ngModelChange)="onBranchChange($event)" class="branch-select">
            <option [ngValue]="null">All Branches</option>
            <option *ngFor="let b of branches()" [value]="b.id">{{ b.branchName }}</option>
          </select>
        </div>
        
        <div class="fixed-branch-info" *ngIf="authService.isTrainer()">
           <span class="branch-tag">Branch: {{ getTrainerBranchName() }}</span>
        </div>
      </div>
      
      <div class="user-profile-wrapper">
        <div class="user-profile" (click)="toggleUserDropdown($event)">
          <div class="user-avatar">
            <svg viewBox="0 0 24 24" width="24" height="24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" fill="none" stroke="currentColor" stroke-width="2"></path><circle cx="12" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle></svg>
          </div>
        </div>

        <div class="user-dropdown" *ngIf="userDropdownOpen()" (click)="$event.stopPropagation()">
          <div class="dropdown-header">
            <span class="user-name">{{ authService.currentUser()?.name }}</span>
            <span class="user-email">{{ authService.currentUser()?.email }}</span>
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-items">
            <button class="dropdown-item exit-btn" (click)="authService.logout()">Logout</button>
          </div>
        </div>
      </div>
    </header>
  </ng-container>

  <main [class.app-main]="!isInvoicePage" [class.full-width]="isInvoicePage">
    <router-outlet></router-outlet>
  </main>
</div>

<ng-template #loginView>
  <router-outlet></router-outlet>
</ng-template>
